<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Network | Solo Leveling Verse</title>
  <meta name="description" content="Interactive relationship map of Solo Leveling: family, allies, enemies, guilds, Monarchs, Rulers and the Shadow Army hierarchy." />
  <meta name="theme-color" content="#04050c" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/system.css" />
  <link rel="stylesheet" href="css/network.css" />
</head>
<body data-page="network">
  <header id="nav"></header>

  <main>
    <section class="page-head">
      <div class="wrap">
        <p class="kicker">Shadow Network</p>
        <h1 class="section-title">Relationship <em>flow</em></h1>
        <p class="section-sub">Pick anyone to see who they are connected to, grouped by kind of relationship. Click a name to put them in the centre, or switch to the Shadow Army chart.</p>
      </div>
    </section>

    <section class="net-section">
      <div class="wrap rel-layout">
        <aside class="rel-side sys" aria-label="Choose who to centre">
          <div class="field"><span class="ico" aria-hidden="true">⌕</span><input id="rel-q" class="input" type="search" autocomplete="off" placeholder="Find anyone…" aria-label="Find anyone" /></div>
          <div class="rel-list" id="rel-list"><p class="flow-none">Loading…</p></div>
        </aside>

        <div class="rel-main" id="rel-main">
          <div class="seg" role="radiogroup" aria-label="View" id="views">
            <button type="button" role="radio" aria-checked="true" data-view="flow">Relationships</button>
            <button type="button" role="radio" aria-checked="false" data-view="army">Shadow Army</button>
          </div>

          <div id="flow-wrap">
            <nav class="flow-trail" id="flow-trail" aria-label="Recently viewed"></nav>
            <div class="chip-row flow-groups" id="flow-groups" aria-label="Relationship kinds"></div>
            <div class="flow" id="flow" aria-live="polite">
              <svg class="flow-lines" id="flow-lines" aria-hidden="true"></svg>
              <div class="flow-col" id="flow-left"></div>
              <div class="flow-centre" id="flow-centre"></div>
              <div class="flow-col" id="flow-right"></div>
            </div>
          </div>

          <div class="army" id="army" hidden aria-live="polite">
            <svg class="flow-lines" id="army-lines" aria-hidden="true"></svg>
            <div id="army-body"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <noscript><p style="padding:20px;text-align:center">The Shadow Network needs JavaScript.</p></noscript>

  <script src="js/data/world.js"></script>
  <script src="js/data/characters.js"></script>
  <script src="js/data/monarchs.js"></script>
  <script src="js/data/shadows.js"></script>
  <script src="js/data/gates.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/data/skills.js"></script>
  <script src="js/data/timeline.js"></script>
  <script src="js/media-index.js"></script>
  <script src="js/core.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/network.js"></script>
</body>
</html>
